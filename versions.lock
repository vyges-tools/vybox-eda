# vybox-eda — pinned versions (single source for scripts/build.sh).
#
# build.sh passes each KEY=VALUE as a --build-arg. The image is built FROM SCRATCH
# on Ubuntu 24.04; the EDA tool versions below match the iic-osic-tools 2026.05
# co-tested set (the matrix reference — see tools.yml) but are built from their
# own pinned upstreams here. Bump one entry per commit.
#
# ⚠️ OPENROAD_REF is the EXCEPTION to the co-tested set: it tracks the commit the
# Vyges engines are correlated against, not the iic matrix. See its note below.

UBUNTU_VERSION=24.04
PYTHON_VERSION=3.12

# EDA tools — iic-osic-tools 2026.05-aligned pins (verified git tags / commits)
YOSYS_REF=v0.65
VERILATOR_REF=v5.048
# OpenROAD is pinned to the SAME commit the Vyges engines are built and correlated
# against, so the container's OpenROAD and the engines shipped beside it agree.
# ⚠️ Move this WITH that pin, never on its own: an image whose OpenROAD and engines
# come from different commits reports differences that belong to neither.
# 7d490b8 = 2026-09-03. Previously 08f67ee5 (2026-05-12), which had drifted 3281
# commits behind. Dependency set is unchanged across the move: OR-Tools 9.14,
# CUDD 3.0.0, LEMON 1.3.1.
OPENROAD_REF=7d490b8ecd357199c0c0e9f3e32becd5eb507c34
# OpenROAD's prebuilt deps (it builds none itself) — iic-aligned pins.
ORTOOLS_VERSION=9.14
CUDD_VERSION=3.0.0
LEMON_VERSION=1.3.1
KLAYOUT_VERSION=0.30.8
MAGIC_REF=8.3.642
NETGEN_REF=1.5.319
NGSPICE_VERSION=46
OPEN_PDKS_REF=7b70722e33c03fcb5dabcf4d479fb0822d9251c9

# Vyges CLI — the RELEASED installer version; `vyges install loom` then pulls the
# whole engine suite (38 binaries) pinned to that same release train.
# ⚠️ Bump this with intent: it decides which Loom engines the image carries.
VYGES_CLI_VERSION=0.1.36

# Vyges binaries build toolchain (unused while the binaries come from releases;
# kept for a from-source stage should one return).
RUST_VERSION=1.83

# Board / mechanical CAD (full target only)
KICAD_VERSION=8.0
FREECAD_VERSION=1.0
OPENSCAD_VERSION=2021.01

# FPGA flow (fpga target) — Lattice Nexus open toolchain + LiteX.
# Pins resolved against upstream HEADs 2026-06-21 (sv2v/slang aligned to tools.yml).
SLANG_PLUGIN_REF=cf20b1ba0d2c9df0508f927930a87565e7e0d220
SV2V_VERSION=v0.0.13
PRJOXIDE_REF=9ab3b4ee3b9c5c1d210243c667b1f39ee7c01496
NEXTPNR_REF=2b560ad0ccc6e7e93ad8bd6cb0f88f925bbb314b
LITEX_REF=f23babce22db4b0803cdb3e78a01653bcba9a337
